<template>
    <style>
        .tab {
            padding: 15px;
            text-align: center;
            cursor: pointer;
            border-bottom: 6px solid #ccc;
        }

        .tab:hover {
            background-color: #ddd;
        }

        .tab.active {
            border-color: #173250 !important;
        }

        .tbl {
            margin-left: 25px;
            margin-right: 25px;
        }

        .m-2 {
            margin: 0 10px;
        }

        .c-content {
            margin-bottom: 20px;
            padding: 20px 0px;
            background-color: #ffffff;
            align-content: center;
        }
    </style>

    <au-input-form title.bind="title" title.bind="title" with.bind="context" options.bind="formOptions">
        <div class="row">
            <div class="col-sm-4 tab ${activeTab === 0 ? 'active' : ''}" click.delegate="changeRole(0)">
                DESCRIPTION
            </div>
            <div class="col-sm-4 tab ${activeTab === 1 ? 'active' : ''}" click.delegate="changeRole(1)">
                DETAIL MEASUREMENT
            </div>
            <div class="col-sm-4 tab ${activeTab === 2 ? 'active' : ''}" click.delegate="changeRole(2)">
                SHIPPING MARK - SIDE MARK - REMARK
            </div>
        </div>
        <br>

        <!-- DESC -->
        <div class="row" if.bind="activeTab==0">
            <div class="row">
                <div class="col-sm-6">
                    <au-textbox label="No Packing List" value.bind="data.packingListNo" read-only="true"
                        options.bind="controlOptions">
                    </au-textbox>

                    <au-dropdown label="Jenis Invoice" value.bind="data.invoiceType" error.bind="error.InvoiceType"
                        read-only="true" items.bind="InvoiceTypeOptions" options.bind="controlOptions">
                    </au-dropdown>

                    <au-dropdown label="Jenis Packing List" value.bind="data.packingListType" error.bind="error.Type"
                        read-only="true" items.bind="PackingTypeOptions" options.bind="controlOptions">
                    </au-dropdown>

                    <au-datepicker label="TGL" value.bind="data.date" error.bind="error.Date" read-only="true"
                        options.bind="controlOptions">
                    </au-datepicker>
                </div>
                <div class="col-sm-6" if.bind="isPackinglistType">
                    <au-dropdown label="Shipment Mode" value.bind="data.shipmentMode" error.bind="error.ShipmentMode"
                        read-only="true" items.bind="ShipmentModeOptions" options.bind="controlOptions">
                    </au-dropdown>

                    <au-datepicker label="Tgl Trucking / Ex-fty" value.bind="data.truckingEstimationDate"
                        error.bind="error.TruckingEstimationDate" read-only="true" options.bind="controlOptions">
                    </au-datepicker>

                    <au-textbox label="Negara Asal Fabric" value.bind="data.fabricCountryOrigin"
                        error.bind="error.FabricCountryOrigin" read-only="true" options.bind="controlOptions">
                    </au-textbox>

                    <au-textbox label="Komposisi Fabric" value.bind="data.fabricComposition"
                        error.bind="error.FabricComposition" read-only="true" options.bind="controlOptions">
                    </au-textbox>

                    <au-multiline value.bind="data.description" label="Keterangan Unit" read-only="true"
                        options.bind="controlOptions">
                    </au-multiline>

                    <au-multiline label="Keterangan dari Md" value.bind="data.remarkMd" error.bind="error.RemarkMd"
                        read-only="true" options.bind="controlOptions">
                    </au-multiline>
                </div>
                <div class="col-sm-6">
                    <au-dropdown label="Destination" value.bind="data.destination" error.bind="error.Destination"
                        read-only.bind="readOnly" items.bind="countries" options.bind="controlOptions">
                    </au-dropdown>

                    <au-datepicker label="TGL Trucking Actual" value.bind="data.truckingDate"
                        error.bind="error.TruckingDate" if.bind="isPackinglistType" read-only.bind="readOnly" options.bind="controlOptions">
                    </au-datepicker>

                    <au-datepicker label="TGL Perkiraan Export" value.bind="data.exportEstimationDate"
                        error.bind="error.ExportEstimationDate" read-only.bind="readOnly" if.bind="isPackinglistType"
                        options.bind="controlOptions">
                    </au-datepicker>

                    <au-checkbox label="Omzet" value.bind="data.omzet" read-only.bind="readOnly"
                        options.bind="controlOptions">
                    </au-checkbox>

                    <au-checkbox label="Accounting" value.bind="data.accounting" read-only.bind="readOnly"
                        options.bind="controlOptions">
                    </au-checkbox>
                </div>
                <div class="form-group has-error">
                    <p if.bind="error.ItemsCount" class="help-block text-center">${error.ItemsCount}</p>
                </div>
                <div class="tbl">
                    <au-collection items.bind="data.items" errors.bind="error.Items" columns.bind="itemsColumns"
                        read-only.bind="readOnly" options.bind="Options"
                        item-template="modules/garment-shipping/packing-list-approval-demo/template/detail-ro">
                    </au-collection>
                </div>

            </div>
            <div class="row" if.bind="data.documentsFile != 0">
                <div class="m-2 col-md-6">
                    <au-textbox label="TOTAL QUANTITY" value.bind="totalQuantities" error.bind="error.totalQuantities"
                        read-only="true" options.bind="controlOptions">
                    </au-textbox>
                </div>
            </div>
            <div class="row" if.bind="data.documentsFile != 0">
                <div class="m-2 col-md-6">
                    <h4>File Dokumen</h4>
                    <table class="table table-hover table-bordered">
                        <thead>
                            <th class="col-md-11">File</th>
                        </thead>
                        <tbody>
                            <tr if.bind="!data.documentsFileName || data.documentsFileName.length < 1">
                                <td colspan="2">
                                    Tidak ada file
                                </td>
                            </tr>
                            <tr if.bind="data.documentsFileName" repeat.for="doc of data.documentsFileName">
                                <td>
                                    <button class="btn btn-primary justify-content-center"
                                        click.delegate="downloadDocument($index)">${doc}</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- MEASUREMENT -->
        <div class="row" show.bind="activeTab==1">
            <div class="row">
                <div class="col-sm-4">
                    <numeric label="GROSS WEIGHT" value.bind="data.grossWeight" error.bind="error.GrossWeight" read-only.bind="true"
                        options.bind="controlOptions">
                    </numeric>
                </div>
                <div class="col-sm-4">
                    <numeric label="NETT WEIGHT" value.bind="data.nettWeight" error.bind="error.NettWeight" read-only.bind="true"
                        options.bind="controlOptions">
                    </numeric>
                </div>
                <div class="col-sm-4">
                    <au-textbox label="TOTAL QUANTITY" value.bind="totalQuantities" error.bind="error.totalQuantities"
                        read-only="true" options.bind="controlOptions">
                    </au-textbox>
                </div>
            </div>
            <div class="class row">
                <div class="col-sm-12">
                    <au-numeric label="TOTAL" value.bind="data.totalCartons" read-only.bind="true" 
                        error.bind="error.totalCartons" options.bind="controlOptions">
                    </au-numeric>
                    <au-textbox label="SAY" value.bind="say" read-only.bind="true">
                    </au-textbox>
                    <au-textbox value.bind="data.sayUnit" error.bind="error.SayUnit" read-only.bind="true"
                        options.bind="controlOptions">
                    </au-textbox>
                </div>
            </div>
            <div class="class row">
                <div class="col-md-12">
                    <au-textbox label="Komoditi" value.bind="data.otherCommodity" error.bind="error.OtherCommodity"
                        read-only.bind="true" options.bind="controlOptions">
                    </au-textbox>
                    <au-numeric label="TOTAL CBM" value.bind="data.totalVolume" error.bind="error.totalVolume" 
                        read-only.bind="true" options.bind="controlOptions">
                    </au-numeric>
                </div>
            </div>
        </div>

        <!-- MARK -->
        <div class="row" if.bind="activeTab==2">
            <div class="row">
                <label class="col-sm-3 text-right">SHIPPING MARK</label>
                <div class="col-sm-7">
                    <div class="thumbnail">
                        <img src.bind="shippingMarkImageSrc">
                        <au-multiline placeholder="Tambah Keterangan" value.bind="data.shippingMark"
                            error.bind="error.ShippingMark" read-only.bind="readOnly">
                        </au-multiline>
                    </div>
                </div>
            </div>

            <div class="row">
                <label class="col-sm-3 text-right">SIDE MARK</label>
                <div class="col-sm-7">
                    <div class="thumbnail">
                        <img src.bind="sideMarkImageSrc">
                        <au-multiline placeholder="Tambah Keterangan" value.bind="data.sideMark"
                            error.bind="error.SideMark" read-only.bind="readOnly">
                        </au-multiline>
                    </div>
                </div>
            </div>

            <div class="row">
                <label class="col-sm-3 text-right">REMARK</label>
                <div class="col-sm-7">
                    <div class="thumbnail">
                        <img src.bind="remarkImageSrc">
                        <au-multiline placeholder="Tambah Keterangan" value.bind="data.remark" error.bind="error.Remark"
                            read-only.bind="readOnly">
                        </au-multiline>
                    </div>
                </div>
            </div>
        </div>
    </au-input-form>
</template>
