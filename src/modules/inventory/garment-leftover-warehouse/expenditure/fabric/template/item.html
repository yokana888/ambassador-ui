<template>
    <tr>
        <td class="col-sm-2">
            <au-autocomplete value.bind="selectedUnit" error.bind="error.Unit" loader.bind="unitLoader"
                read-only.bind="true" placeholder="Unit" text="Code">
            </au-autocomplete>
        </td>

        <td class="col-sm-2">
            <au-textbox value.bind="data.Product.Code" read-only="true" placeholder="Kode Produk">
            </au-textbox>
        </td>

        <td class="col-sm-2">
            <au-textbox value.bind="data.Product.Name" read-only="true" placeholder="Nama Produk">
            </au-textbox>
        </td>

        <td class="col-sm-2">
            <au-textbox value.bind="selectedUom" error.bind="error.Uom" read-only.bind="true">
            </au-textbox>
        </td>

        <td class="col-sm-2">
            <au-numeric value.bind="data.Quantity" error.bind="error.Quantity" read-only.bind="readOnly" format="0.00">
            </au-numeric>
        </td>
    </tr>
</template>
