<template>
    <tr>
        <td class="col-sm-2">
            <au-autocomplete value.bind="selectedUnit" error.bind="error.Unit" loader.bind="unitLoader"
                read-only.bind="true" placeholder="Unit" text="Code">
            </au-autocomplete>
        </td>

        <td class="col-sm-2">
            <au-autocomplete value.bind="selectedProduct" error.bind="error.Product" loader.bind="productLoader"
                query.bind="productLoaderFilter" select.bind="productLoaderSelect" read-only.bind="true"
                placeholder="Kode Barang" text="ProductCode" view-model.ref="selectedProductViewModel">
            </au-autocomplete>
        </td>

        <td class="col-sm-2">
            <au-textbox value.bind="data.Product.Name" read-only="true">
            </au-textbox>
        </td>

        <td class="col-sm-2">
            <au-dropdown items.bind="uomItems" value.bind="selectedUom" error.bind="error.Uom"
                read-only.bind="true">
            </au-dropdown>
        </td>

        <td class="col-sm-2">
            <au-numeric value.bind="data.Quantity" error.bind="error.Quantity" read-only.bind="true" format="0.00">
            </au-numeric>
        </td>

        <td if.bind="!readOnly">
            <button class="btn btn-danger pull-right" click.delegate="onremove(data, $event)">-</button>
        </td>
    </tr>
</template>
